name: Publish Docker Image (Reusable)

on:
  workflow_call:
    inputs:
      image_role:
        description: Logical deployment role
        required: true
        type: string
      image_name:
        type: string
        required: true
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false
    outputs:
      image_tag:
        description: The tag of the published Docker image
        value: ${{ jobs.publish.outputs.image_tag }}
    secrets:
      registry_token:
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.publish.outputs.image_tag }}
    
    steps:
      - uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.image_name }}-image

      - name: Load Docker image
        run: docker load -i ${{ inputs.image_name }}.tar

      - name: Docker Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token || github.token }}

      - name: Tag Image
        run: |
          IMAGE="${{ inputs.image_name }}"
          VERSION="${{ inputs.version }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"

          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"   # LOWERCASE here
          GHCR="ghcr.io/$OWNER/$IMAGE"

          docker tag "$IMAGE:$SHA_TAG" "$GHCR:$VERSION"
          docker tag "$IMAGE:$SHA_TAG" "$GHCR:$SHA_TAG"

          if [ "${{ inputs.push_latest }}" = "true" ]; then
            docker tag "$IMAGE:$SHA_TAG" "$GHCR:latest"
          fi

      - name: Push Image
        id: publish
        env:
          IMAGE_ROLE: ${{ inputs.image_role }}
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image_name }}"
          VERSION="${{ inputs.version }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"   # LOWERCASE here
          GHCR="ghcr.io/$OWNER/$IMAGE"

          docker push "$GHCR:$VERSION"
          docker push "$GHCR:$SHA_TAG"

          if [ "${{ inputs.push_latest }}" = "true" ]; then
            docker push "$GHCR:latest"
          fi

          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT

          digest_ref=$(
            docker image inspect "$IMAGE:$SHA_TAG" \
              --format '{{json .RepoDigests}}' |
            jq -er --arg prefix "$GHCR@" '
              [.[] | select(startswith($prefix))]
              | unique
              | if length == 1 then .[0]
                else error("Expected one matching image digest")
                end
            '
          )

          mkdir -p release-metadata

          jq -n \
            --arg image "$IMAGE" \
            --arg reference "$digest_ref" \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg role "$IMAGE_ROLE" \
            '{
              role: $role,
              image: $image,
              reference: $reference,
              version: $version,
              commit: $commit,
              run_id: $run_id,
              run_attempt: $run_attempt
            }' > "release-metadata/$IMAGE.json"

      - name: Upload published image receipt
        uses: actions/upload-artifact@v7
        with:
          name: release-image-${{ inputs.image_name }}-${{ github.run_attempt }}
          path: release-metadata/${{ inputs.image_name }}.json
          if-no-files-found: error
          retention-days: 7