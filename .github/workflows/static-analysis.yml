name: Static Analysis (reusable)

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string    

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: ./.github/actions/authenticate-github-packages
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore solution
        run: dotnet restore "${{ inputs.solution_file }}"

      - name: Check code format
        run: |
          dotnet format "${{ inputs.solution_file }}" --verify-no-changes --no-restore

      # Build with analyzers and treat warnings as errors
      - name: Build with analyzers
        run: |
          dotnet build "${{ inputs.solution_file }}" \
            --configuration Release --no-restore
