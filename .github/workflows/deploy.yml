name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      app_image:
        description: Complete API image reference
        required: true
        type: string
      migrator_image:
        description: Complete migrator image reference
        required: true
        type: string
      provisioner_image:
        description: Complete provisioner image reference
        required: true
        type: string
      source_commit:
        description: Validated application commit
        required: true
        type: string
      require_current_main:
        description: Reject automatic releases superseded on main
        required: true
        type: boolean
    outputs:
      deployment_uri:
        description: The URI of the deployed application
        value: ${{ jobs.deploy.outputs.deployment_uri }}
    secrets:
      azure_credentials:
        required: true
      pulumi_access_token:
        required: true
      ghcr_pull_token:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.pulumi_access_token }}
      ARM_CLIENT_ID: ${{ fromJson(secrets.azure_credentials).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.azure_credentials).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.azure_credentials).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.azure_credentials).tenantId }}
      GHCR_PULL_TOKEN: ${{ secrets.ghcr_pull_token }}
    defaults:
      run:
        shell: bash
        working-directory: infra/Pulumi/AzureDev
    outputs:
      deployment_uri: ${{ steps.get-uri.outputs.deployment_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.azure_credentials }}

      - name: Set up Pulumi CLI
        uses: pulumi/actions@v7
        with:
          pulumi-version: 3.268.0

      - name: Select Pulumi stack
        run: pulumi stack select ${{ inputs.environment }}

      - name: Configure optional registry credentials
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          if [ -n "$GHCR_PULL_TOKEN" ]; then
            pulumi config set \
              --stack "${{ inputs.environment }}" \
              thunderbirds-azure-dev:registryUsername "$OWNER"

            pulumi config set \
              --secret \
              --stack "${{ inputs.environment }}" \
              thunderbirds-azure-dev:registryPassword "$GHCR_PULL_TOKEN"
          fi

      - name: Check automatic release is still current
        if: inputs.require_current_main
        uses: actions/github-script@v9
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        with:
          script: |
            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main"
            });

            if (process.env.SOURCE_COMMIT !== main.commit.sha) {
              throw new Error(
                "Deployment stopped before Azure update: " +
                "a newer commit exists on main."
              );
            }

      - name: Deploy to Azure
        env:
          APP_IMAGE: ${{ inputs.app_image }}
          MIGRATOR_IMAGE: ${{ inputs.migrator_image }}
          PROVISIONER_IMAGE: ${{ inputs.provisioner_image }}
        run: |
          set -euo pipefail

          pulumi up \
            --yes \
            --stack "${{ inputs.environment }}" \
            --config "thunderbirds-azure-dev:containerImage=$APP_IMAGE" \
            --config "thunderbirds-azure-dev:databaseMigratorImage=$MIGRATOR_IMAGE" \
            --config "thunderbirds-azure-dev:databaseProvisionerImage=$PROVISIONER_IMAGE"

      - name: Get Deployment URI
        id: get-uri
        run: |
          # Fetch the deployment URI from Pulumi stack output.
          DEPLOYMENT_URI=$(pulumi stack output applicationUrl)
          echo "deployment_uri=$DEPLOYMENT_URI" >> $GITHUB_OUTPUT
