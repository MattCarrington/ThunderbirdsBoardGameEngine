name: CI

on:
  pull_request:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  packages: write

env:
  SOLUTION_FILE: &solution ThunderbirdsBoardGameEngine.sln
  APP_IMAGE_NAME: &app_image_name "thunderbirds-app"
  SMOKE_IMAGE_NAME: &smoke_image_name "thunderbirds-smoke-tests"
  MIGRATOR_IMAGE_NAME: &migrator_image_name "thunderbirds-game-state-db-migrator"
  PROVISIONER_IMAGE_NAME: &provisioner_image_name "thunderbirds-game-state-db-provisioner"
  BASE_URL: &base_url "http://localhost:8080"
  
jobs:
  ci-script-tests:
    uses: ./.github/workflows/tests-ci-scripts.yml

  static-analysis:
    uses: ./.github/workflows/static-analysis.yml
    with:
      solution_file: *solution

  build:
    uses: ./.github/workflows/build.yml
    with:
      solution_file: *solution
    needs:
      - static-analysis

  docker-build:
    name: Build ${{ matrix.image_name }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: *app_image_name
            dockerfile_path: src/Api/ThunderbirdsBoardGameEngine.Api/Dockerfile
          - image_name: *migrator_image_name
            dockerfile_path: src/GameState/ThunderbirdsBoardGameEngine.GameState.EF.DatabaseMigrator/Dockerfile
          - image_name: *provisioner_image_name
            dockerfile_path: tools/GameState/ThunderbirdsBoardGameEngine.GameState.DatabaseProvisioner/Dockerfile
    uses: ./.github/workflows/build-docker.yml
    with:
      image_name: ${{ matrix.image_name }}
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_build_context: "."
    needs:
      - static-analysis

  tests:
    uses: ./.github/workflows/tests-dotnet.yml
    with:
      solution_file: *solution
      run_component: true
    needs:
      - build

  tests-docker:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests-docker.yml
    with:
      solution_file: *solution
      app_image_name: *app_image_name
      database_migrator_image_name: *migrator_image_name
      database_provisioner_image_name: *provisioner_image_name
      run_integration: true
      run_playwright: true
      base_url: *base_url
    needs:
      - build
      - docker-build

  compute-version:
    if: github.event_name == 'push'
    uses: ./.github/workflows/version.yml
    with:
      pr_title: ${{ github.event.pull_request.title || github.event.head_commit.message }}
    needs:
      - tests
      - tests-docker
      - ci-script-tests

  tag-repo:
    if: github.ref == 'refs/heads/main' && needs.compute-version.outputs.release_type != 'none'
    uses: ./.github/workflows/tag-repo.yml
    with:
      version: ${{ needs.compute-version.outputs.version }}
      tag_prefix: "server/v"
    needs:
      - compute-version

  docker-publish:
    name: Publish ${{ matrix.image_name }}
    if: github.event_name == 'push' && needs.compute-version.outputs.release_type != 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: *app_image_name
          - image_name: *migrator_image_name
          - image_name: *provisioner_image_name
    uses: ./.github/workflows/publish-docker.yml
    with:
      image_name: ${{ matrix.image_name }}
      version: ${{ needs.compute-version.outputs.version }}
      push_latest: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - docker-build
      - compute-version

  packages:
    if: github.event_name == 'push' && needs.compute-version.outputs.release_type != 'none'
    uses: ./.github/workflows/package-release.yml
    with:
      before_sha: ${{ github.event.before }}
      default_branch: ${{ github.event.repository.default_branch }}
    secrets: inherit
    needs:
      - compute-version

  deploy:
    name: Deploy Application
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      app_image_name: *app_image_name 
      database_migrator_image_name: *migrator_image_name
      database_provisioner_image_name: *provisioner_image_name
      image_tag: ${{ needs.compute-version.outputs.version }}
      environment: "dev"
    secrets: inherit
    needs:
      - docker-publish
      - compute-version

  smoke-tests:
    name: Run Smoke Tests
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: read
    uses: ./.github/workflows/smoke-tests.yml
    with:
      deployment_uri: ${{ needs.deploy.outputs.deployment_uri }}
      image_tag: ${{ vars.SMOKE_IMAGE_TAG || 'latest' }}
    needs:
      - deploy
