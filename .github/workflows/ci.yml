name: CI

on:
  pull_request:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  packages: write

env:
  SOLUTION_FILE: &solution ThunderbirdsBoardGameEngine.sln
  APP_IMAGE_NAME: &app_image_name "thunderbirds-app"
  SMOKE_IMAGE_NAME: &smoke_image_name "thunderbirds-smoke-tests"
  MIGRATOR_IMAGE_NAME: &migrator_image_name "thunderbirds-game-state-db-migrator"
  PROVISIONER_IMAGE_NAME: &provisioner_image_name "thunderbirds-game-state-db-provisioner"
  BASE_URL: &base_url "http://localhost:8080"
  
jobs:
  ci-script-tests:
    uses: ./.github/workflows/tests-ci-scripts.yml

  static-analysis:
    uses: ./.github/workflows/static-analysis.yml
    with:
      solution_file: *solution

  build:
    uses: ./.github/workflows/build.yml
    with:
      solution_file: *solution
    needs:
      - static-analysis

  docker-build:
    name: Build ${{ matrix.image_name }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: *app_image_name
            dockerfile_path: src/Api/ThunderbirdsBoardGameEngine.Api/Dockerfile
          - image_name: *migrator_image_name
            dockerfile_path: src/GameState/ThunderbirdsBoardGameEngine.GameState.EF.DatabaseMigrator/Dockerfile
          - image_name: *provisioner_image_name
            dockerfile_path: tools/GameState/ThunderbirdsBoardGameEngine.GameState.DatabaseProvisioner/Dockerfile
    uses: ./.github/workflows/build-docker.yml
    with:
      image_name: ${{ matrix.image_name }}
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_build_context: "."
    needs:
      - static-analysis

  tests:
    uses: ./.github/workflows/tests-dotnet.yml
    with:
      solution_file: *solution
      run_component: true
    needs:
      - build

  tests-docker:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests-docker.yml
    with:
      solution_file: *solution
      app_image_name: *app_image_name
      database_migrator_image_name: *migrator_image_name
      database_provisioner_image_name: *provisioner_image_name
      run_integration: true
      run_playwright: true
      base_url: *base_url
    needs:
      - build
      - docker-build

  compute-version:
    if: github.event_name == 'push'
    uses: ./.github/workflows/version.yml
    with:
      pr_title: ${{ github.event.pull_request.title || github.event.head_commit.message }}
    needs:
      - tests
      - tests-docker
      - ci-script-tests

  tag-repo:
    if: github.ref == 'refs/heads/main' && needs.compute-version.outputs.release_type != 'none'
    uses: ./.github/workflows/tag-repo.yml
    with:
      version: ${{ needs.compute-version.outputs.version }}
      tag_prefix: "server/v"
    needs:
      - compute-version

  docker-publish:
    name: Publish ${{ matrix.image_name }}
    if: github.event_name == 'push' && needs.compute-version.outputs.release_type != 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_role: app
            image_name: *app_image_name
          - image_role: migrator
            image_name: *migrator_image_name
          - image_role: provisioner
            image_name: *provisioner_image_name
    uses: ./.github/workflows/publish-docker.yml
    with:
      image_role: ${{ matrix.image_role }}
      image_name: ${{ matrix.image_name }}
      version: ${{ needs.compute-version.outputs.version }}
      push_latest: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - docker-build
      - compute-version

  packages:
    if: github.event_name == 'push' && needs.compute-version.outputs.release_type != 'none'
    uses: ./.github/workflows/package-release.yml
    with:
      before_sha: ${{ github.event.before }}
      default_branch: ${{ github.event.repository.default_branch }}
    secrets: inherit
    needs:
      - compute-version

  release-manifest:
    name: Assemble release manifest
    if: github.event_name == 'push' && needs.compute-version.outputs.release_type != 'none'
    runs-on: ubuntu-latest
    needs:
      - docker-publish
      - compute-version
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download published image receipts
        uses: actions/download-artifact@v8
        with:
          pattern: release-image-*
          path: release-metadata
          merge-multiple: false

      - name: Validate receipts and create manifest
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ needs.compute-version.outputs.version }}
        with:
          script: |
            const fs = require("node:fs/promises");
            const path = require("node:path");

            const { assembleReleaseManifest } = require(
              path.join(
                process.env.GITHUB_WORKSPACE,
                ".github/scripts/release-manifest.cjs"
              )
            );

            const entries = await fs.readdir("release-metadata", {
              withFileTypes: true
            });

            const receipts = await Promise.all(
              entries.map(async entry => {
                if (!entry.isDirectory()) {
                  throw new Error("Expected a directory for each receipt artifact.");
                }

                const directory = path.join("release-metadata", entry.name);
                const files = await fs.readdir(directory);

                if (files.length !== 1 || !files[0].endsWith(".json")) {
                  throw new Error("Expected one JSON receipt per artifact.");
                }

                const receipt = JSON.parse(
                  await fs.readFile(path.join(directory, files[0]), "utf8")
                );

                const expectedArtifactName =
                  `release-image-${receipt.image}-${receipt.run_attempt}`;

                if (entry.name !== expectedArtifactName) {
                  throw new Error("Receipt does not match its artifact name.");
                }

                return receipt;
              })
            );

            const manifest = assembleReleaseManifest(receipts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit: process.env.GITHUB_SHA,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              version: process.env.RELEASE_VERSION
            });

            await fs.mkdir("release", { recursive: true });
            await fs.writeFile(
              "release/release-manifest.json",
              JSON.stringify(manifest, null, 2) + "\n"
            );

            core.info("Validated release manifest created.");

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.run_attempt }}
          path: release/release-manifest.json
          if-no-files-found: error
          retention-days: 7