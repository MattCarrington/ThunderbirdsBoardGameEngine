services:
  api:
    container_name: thunderbirds-api
    build:
      context: ..
      dockerfile: src/Api/ThunderbirdsBoardGameEngine.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"
    depends_on:
      game-state-db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  game-state-db-migrator:
    build:
      context: ..
      dockerfile: src/GameState/ThunderbirdsBoardGameEngine.GameState.EF.DatabaseMigrator/Dockerfile
    depends_on:
      game-state-db:
        condition: service_healthy
    restart: "no"

  game-state-db:
    image: postgres:16
    environment:
      POSTGRES_DB: thunderbirds_game_state
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GAME_STATE_DB_PASSWORD}
    volumes:
      - game-state-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d thunderbirds_game_state"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  game-state-data:
    
